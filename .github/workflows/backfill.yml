name: Backfill battery history
# The deploy only has a few minutes each run to fetch battery history, so this
# job fetches for much longer, in parallel, into its own cache. The deploy
# merges that cache in, and this job merges the deploy's, so neither job
# overwrites the other's days. Once the history is complete each run finishes
# in a minute or two.
on:
  schedule:
    - cron: '10 */2 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: Minutes to spend fetching
        default: '100'
permissions:
  contents: read
concurrency:
  group: backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: backfill-${{ github.run_id }}
          restore-keys: backfill-
      - uses: actions/cache/restore@v4
        with:
          path: .cache-deploy
          key: battery-${{ github.run_id }}
          restore-keys: battery-
      - run: node pipeline/build.mjs --budget-minutes ${{ inputs.budget || '100' }} --concurrency 4 --merge-cache .cache-deploy --out .backfill-out
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: backfill-${{ github.run_id }}
  # Australia's history, a month per download of a few hundred MB, into the
  # cache the deploy reads. It shares the deploy's group so the two never
  # save over each other's cache; once the history is in, it takes a minute.
  australia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache/restore@v4
        with:
          path: .cache-au
          key: au-${{ github.run_id }}
          restore-keys: au-
      - run: node pipeline/build-au.mjs --budget-minutes 40 --concurrency 4 --out .backfill-out/au
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-au
          key: au-${{ github.run_id }}
