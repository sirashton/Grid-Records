name: CI
on:
  push:
    branches-ignore: [main, preview, analytics]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      # A short pipeline run against the real feeds, to catch upstream changes.
      - run: node pipeline/build.mjs --budget-minutes 2 --backfill-from "$(date -u -d '-10 days' +%F)"
      - uses: actions/cache/restore@v4
        with:
          path: .cache-nz
          key: nz-${{ github.run_id }}
          restore-keys: nz-
      - run: node pipeline/build-nz.mjs --budget-minutes 8
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-nz
          key: nz-${{ github.run_id }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache-de
          key: de-${{ github.run_id }}
          restore-keys: de-
      - run: node pipeline/build-de.mjs --budget-minutes 4
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-de
          key: de-${{ github.run_id }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache-pl
          key: pl-${{ github.run_id }}
          restore-keys: pl-
      - run: node pipeline/build-pl.mjs --budget-minutes 5
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-pl
          key: pl-${{ github.run_id }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache-fr
          key: fr-${{ github.run_id }}
          restore-keys: fr-
      - run: node pipeline/build-fr.mjs --budget-minutes 6
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-fr
          key: fr-${{ github.run_id }}
      - run: ls -la site/data/fr && node -e "const m=require('./site/data/fr/meta.json'); console.log(m.length, m.columns, m.years)"
        continue-on-error: true
      - uses: actions/cache/restore@v4
        with:
          path: .cache-bg
          key: bg-${{ github.run_id }}
          restore-keys: bg-
      - run: node pipeline/build-bg.mjs --budget-minutes 10
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-bg
          key: bg-${{ github.run_id }}
      - run: ls -la site/data/bg && node -e "const m=require('./site/data/bg/meta.json'); console.log(m.length, m.columns, m.years, 'to', new Date(m.startMs + (Math.max(...Object.values(m.lastSlot)) + 1) * 900000).toISOString())"
        continue-on-error: true
      # TEMPORARY while building the Bulgaria page: its data on its own branch.
      - name: Publish BG data (temporary)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          cp -r site/data/bg /tmp/bgdata
          cd /tmp/bgdata
          git init -q -b preview-bg
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "BG data of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" preview-bg
      - uses: actions/cache/restore@v4
        with:
          path: .cache-br
          key: br-${{ github.run_id }}
          restore-keys: br-
      - run: node pipeline/build-br.mjs --budget-minutes 8
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-br
          key: br-${{ github.run_id }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache-wa
          key: wa-${{ github.run_id }}
          restore-keys: wa-
      - run: node pipeline/build-wa.mjs --budget-minutes 8 --concurrency 6
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-wa
          key: wa-${{ github.run_id }}
      - run: ls -la site/data/wa && node -e "const m=require('./site/data/wa/meta.json'); console.log(m.length, m.columns, m.files, 'from', new Date(m.startMs).toISOString(), 'to', new Date(m.startMs + (Math.max(...Object.values(m.lastSlot)) + 1) * 1800000).toISOString())"
      - run: ls -la site/data/br && node -e "const m=require('./site/data/br/meta.json'); console.log(m.length, m.columns, m.files)"
      - run: ls -la site/data/pl && node -e "const m=require('./site/data/pl/meta.json'); console.log(m.length, m.columns, m.years)"
      - run: ls -la site/data/de && node -e "const m=require('./site/data/de/meta.json'); console.log(m.length, m.columns, m.years)"
      - uses: actions/cache/restore@v4
        with:
          path: .cache-au
          key: au-${{ github.run_id }}
          restore-keys: au-
      - run: node pipeline/build-au.mjs --budget-minutes 12 --concurrency 4
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-au
          key: au-${{ github.run_id }}
      - run: ls -la site/data/au/nem && node -e "const m=require('./site/data/au/nem/meta.json'); console.log(m.length, m.columns, m.months, m.recent, 'data to', new Date(m.startMs + (Math.max(...Object.values(m.lastSlot)) + 1) * 1800000).toISOString())"
      - run: ls -la site/data site/data/nz && node -e "const m=require('./site/data/nz/meta.json'); console.log(m.length, m.columns, m.months)"
      - run: ls -la site/data && node -e "const m=require('./site/data/meta.json'); console.log(m.length, m.columns, m.battery.coverage, m.battery.units.length)"
      # Snapshot the built site, data included, on a throwaway branch for previews.
      - name: Publish preview branch
        if: github.event_name == 'push'
        run: |
          cp -r site /tmp/preview
          cd /tmp/preview
          git init -q -b preview
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Preview of ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" preview
