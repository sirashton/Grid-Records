name: Probe WA (temporary)
on:
  push:
    branches: [claude/project-thread-imxb9x]
    paths: [.github/workflows/probe-wa.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://data.wa.aemo.com.au/public/public-data/datafiles
          echo "=== post-facilities"; curl -sSL -m 60 "$B/post-facilities/facilities.csv"
          echo "=== facilities (pre)"; curl -sSL -m 60 "$B/facilities/facilities.csv" | head -5
          echo "=== realtime"; curl -sSL -m 60 "$B/current-realtime/CURRENT_REALTIME_DATA.xml"
          echo; echo "=== historical-output"; curl -sSL -m 120 "$B/historical-output/historical-output-2028.csv" | head -4
          echo "=== op demand 2021"; curl -sSL -m 60 "$B/operational-demand/operational-demand-2021.csv" | head -3
          echo "=== op demand withdrawal 2026"; curl -sSL -m 60 "$B/operational-demand-withdrawal-csv/OperationalDemandWithdrawal-2026.csv" | head -3
          for m in 2006-10 2009-06 2012-06 2015-06 2018-06 2021-06 2023-09; do
            curl -sSL -m 300 "$B/facility-scada/facility-scada-$m.csv" | awk -F, -v m=$m 'NR>1{gsub(/"/,"",$5); v=$6*2; if(v>mx[$5])mx[$5]=v; s[$5]+=$6} END{for(k in mx) printf "OLD %s %s max=%.0f avg=%.0f\n", m, k, mx[k], s[k]*2/1440}'
          done
          curl -sSL -m 300 "$B/facility-scada-csv/FacilityScada-2026-09.csv" | awk -F, 'NR>1{gsub(/"/,"",$2); v=$3*12; if(v>mx[$2])mx[$2]=v; if(v<mn[$2])mn[$2]=v; s[$2]+=$3} END{for(k in mx) printf "NEW 2026-09 %s max=%.0f min=%.0f avg=%.0f\n", k, mx[k], mn[k], s[k]/720}'
          echo "=== intervals per day check"; curl -sSL -m 300 "$B/facility-scada-csv/FacilityScada-2026-09.csv" | awk -F, 'NR>1{print $1}' | sort -u | wc -l
