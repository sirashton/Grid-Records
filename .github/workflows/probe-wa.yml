name: Probe WA (temporary)
on:
  push:
    branches: [claude/project-thread-imxb9x]
    paths: [.github/workflows/probe-wa.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://data.wa.aemo.com.au/public/public-data/datafiles
          for d in facilities post-facilities current-realtime operational-demand operational-demand-withdrawal-csv facility-scada-eoi-csv historical-output tt30gen; do
            echo "=== LIST $d"; curl -sSL -m 60 "$B/$d/" | sed 's/<[^>]*>/ /g' | grep -E '[0-9]{4}|csv|json|zip' | head -25; echo; curl -sSL -m 60 "$B/$d/" | sed 's/<[^>]*>/ /g' | grep -E 'csv|json|zip' | tail -5
          done
          for f in facility-scada/facility-scada-2006-09.csv facility-scada/facility-scada-2023-09.csv facility-scada/facility-scada-2023-10.csv facility-scada-csv/FacilityScada-2023-10.csv facility-scada-csv/FacilityScada-2026-10.csv distributed-pv/distributed-pv-2020.csv distributed-pv/distributed-pv-2026.csv estimated-dpv-csv/distributed-pv-new-2026.csv; do
            echo "=== FILE $f"; curl -sSL -m 300 -o /tmp/x "$B/$f"; ls -la /tmp/x; head -6 /tmp/x; echo ...; tail -3 /tmp/x; wc -l /tmp/x
            echo "--- distinct col2/col3 sample"; cut -d, -f1-4 /tmp/x | sed -n '2,400000p' | awk -F, '{print $3}' | sort | uniq -c | sort -rn | head -5
          done
          echo "=== facility names 2026-10"; curl -sSL -m 300 "$B/facility-scada-csv/FacilityScada-2026-10.csv" | awk -F, 'NR>1{print $3}' | sort -u | tr '\n' ' '
          echo; echo "=== facility names 2023-09"; curl -sSL -m 300 "$B/facility-scada/facility-scada-2023-09.csv" | awk -F, 'NR>1{print $3}' | sort -u | tr '\n' ' '
