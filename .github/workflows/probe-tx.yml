name: Probe Texas
on:
  push:
    branches: [claude/project-thread-2xmeca]
    paths: [pipeline/probe/**, .github/workflows/probe-tx.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node pipeline/probe/tx.mjs
      - run: pip install xlrd==2.0.1 && python3 pipeline/probe/xls.py
      - run: which soffice libreoffice || echo no-libreoffice
