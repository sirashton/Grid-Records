name: Probe
on:
  push:
    branches: [probe-hmd]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for pre in "Datasets/Environment/" "Datasets/Environment/_AdditionalInformation/ArchivedDatasets/20241231_HydrologicalModellingDataset/"; do
            echo "== $pre"
            curl -sS "https://emidatasets.blob.core.windows.net/publicdata?restype=container&comp=list&prefix=$pre&maxresults=5000" -o list.xml
            head -c 300 list.xml; echo
            grep -o '<Name>[^<]*</Name>' list.xml | sed 's/<\/\?Name>//g' | sed 's#/[^/]*$##' | sort | uniq -c | head -80
          done
      - run: |
          curl -sS "https://emidatasets.blob.core.windows.net/publicdata?restype=container&comp=list&prefix=Datasets/Environment/_AdditionalInformation/ArchivedDatasets/20241231_HydrologicalModellingDataset/&maxresults=5000" | grep -o '<Name>[^<]*</Name>' | sed 's/<\/\?Name>//g' | grep -iv "flow_[0-9]" | head -150
