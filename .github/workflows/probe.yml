name: Probe
on:
  push:
    branches: [claude/project-thread-2xmeca]
    paths: [pipeline/probe/**, .github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for f in pipeline/probe/*.mjs; do node "$f"; done
