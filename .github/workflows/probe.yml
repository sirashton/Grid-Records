name: Probe
on:
  push:
    branches: [probe-hmd]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS "https://emidatasets.blob.core.windows.net/publicdata?restype=container&comp=list&prefix=Datasets/Environment/HydrologicalModellingDataset/" | grep -o '<Name>[^<]*</Name><Properties>[^/]*<Content-Length>[0-9]*' | sed 's/<Properties>.*<Content-Length>/ /;s/<\/\?Name>//g' | head -400
      - run: |
          curl -sS "https://archive-api.open-meteo.com/v1/archive?latitude=-44&longitude=170&start_date=2001-01-01&end_date=2001-01-02&hourly=shortwave_radiation,wind_speed_100m" | head -c 600
