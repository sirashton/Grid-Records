name: Probe
on:
  push:
    branches: [probe-hmd]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scratch/fetch.sh
      - run: |
          cd out && gzip -9r weather && git init -q && git checkout -q -b nz-hydro-data && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm "HMD and weather data"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" nz-hydro-data
