name: Update data and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: battery-${{ github.run_id }}
          restore-keys: battery-
      # Days the backfill workflow has fetched, merged in by the build.
      - uses: actions/cache/restore@v4
        with:
          path: .cache-backfill
          key: backfill-${{ github.run_id }}
          restore-keys: backfill-
      - uses: actions/cache/restore@v4
        with:
          path: .cache-nz
          key: nz-${{ github.run_id }}
          restore-keys: nz-
      - run: node pipeline/nav.mjs
      - run: npm test
      - run: node pipeline/build.mjs --budget-minutes 3 --concurrency 2 --merge-cache .cache-backfill
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: battery-${{ github.run_id }}
      # New Zealand. A failure here leaves the GB page to deploy as normal.
      - run: node pipeline/build-nz.mjs --budget-minutes 4
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-nz
          key: nz-${{ github.run_id }}
      # Germany, likewise.
      - uses: actions/cache/restore@v4
        with:
          path: .cache-de
          key: de-${{ github.run_id }}
          restore-keys: de-
      - run: node pipeline/build-de.mjs --budget-minutes 3
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-de
          key: de-${{ github.run_id }}
      # Australia, the same way. backfill.yml fetches the history; this keeps the latest months fresh.
      - uses: actions/cache/restore@v4
        with:
          path: .cache-au
          key: au-${{ github.run_id }}
          restore-keys: au-
      - run: node pipeline/build-au.mjs --budget-minutes 6
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-au
          key: au-${{ github.run_id }}
      # Poland, likewise.
      - uses: actions/cache/restore@v4
        with:
          path: .cache-pl
          key: pl-${{ github.run_id }}
          restore-keys: pl-
      - run: node pipeline/build-pl.mjs --budget-minutes 3
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-pl
          key: pl-${{ github.run_id }}
      # Brazil, likewise. The first runs backfill the 26-year ONS history
      # into the cache; after that a run fetches only files ONS replaced.
      - uses: actions/cache/restore@v4
        with:
          path: .cache-br
          key: br-${{ github.run_id }}
          restore-keys: br-
      - run: node pipeline/build-br.mjs --budget-minutes 4
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-br
          key: br-${{ github.run_id }}
      # France, likewise (Energy-Charts, as Germany and Poland).
      - uses: actions/cache/restore@v4
        with:
          path: .cache-fr
          key: fr-${{ github.run_id }}
          restore-keys: fr-
      - run: node pipeline/build-fr.mjs --budget-minutes 3
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-fr
          key: fr-${{ github.run_id }}
      # Western Australia, likewise: the first runs backfill 20 years of
      # facility files from AEMO's slow server; after that a run fetches
      # only the current month's files, which AEMO rewrites each morning.
      - uses: actions/cache/restore@v4
        with:
          path: .cache-wa
          key: wa-${{ github.run_id }}
          restore-keys: wa-
      - run: node pipeline/build-wa.mjs --budget-minutes 4 --concurrency 6
        continue-on-error: true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-wa
          key: wa-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
