name: Update data and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: battery-${{ github.run_id }}
          restore-keys: battery-
      # Days the backfill workflow has fetched, merged in by the build.
      - uses: actions/cache/restore@v4
        with:
          path: .cache-backfill
          key: backfill-${{ github.run_id }}
          restore-keys: backfill-
      - run: npm test
      - run: node pipeline/build.mjs --budget-minutes 3 --concurrency 2 --merge-cache .cache-backfill
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: battery-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
